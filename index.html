<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday Gift 💖</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(to right, #ff9ecf, #ffc0cb);
  margin: 0;
  overflow-x: hidden;
}

h1 { margin-top: 20px; }

button {
  padding: 12px;
  margin: 8px;
  border: none;
  border-radius: 10px;
  background: hotpink;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

.card {
  background: white;
  padding: 20px;
  margin: 20px auto;
  border-radius: 15px;
  max-width: 700px;
}

.section { display: none; }
.active { display: block; }

/* REASONS */
.reasonCard {
  background: white;
  margin: 10px auto;
  padding: 15px;
  border-radius: 10px;
  max-width: 500px;
  opacity: 0;
  transform: scale(0.8);
  transition: 0.3s;
}
.reasonCard.show {
  opacity: 1;
  transform: scale(1);
}

/* ENVELOPES */
.envelope {
  background: white;
  margin: 10px auto;
  padding: 15px;
  border-radius: 12px;
  cursor: pointer;
  max-width: 450px;
}

/* CONFETTI */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  top: -10px;
  animation: fall linear forwards;
}

@keyframes fall {
  to { transform: translateY(100vh) rotate(360deg); }
}

/* BALLOONS */
.balloon {
  position: fixed;
  bottom: -100px;
  font-size: 30px;
  animation: rise 6s linear forwards;
}

@keyframes rise {
  to { transform: translateY(-120vh); }
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday Auntie Nas 💖</h1>

<button onclick="start()">🎁 Open Your Gift</button>

<div id="menu" style="display:none;">
  <button onclick="show('letter')">💌 Letter</button>
  <button onclick="show('reasons')">🎂 35 Reasons</button>
  <button onclick="show('envelopes')">✉️ Open When</button>
</div>

<!-- LETTER -->
<div id="letter" class="section">
  <div class="card" onclick="openLetter()">
    <h2>✉️ Click to Open Letter</h2>
  </div>

  <div id="letterContent" class="card" style="display:none;">
    <div id="typedLetter"></div>
  </div>

  <button onclick="back()">⬅ Back</button>
</div>

<!-- REASONS -->
<div id="reasons" class="section">
  <div class="card">
    <button onclick="showReasons()">🎂 Reveal 35 Reasons</button>
    <div id="reasonBox"></div>
  </div>
  <button onclick="back()">⬅ Back</button>
</div>

<!-- ENVELOPES -->
<div id="envelopes" class="section">

  <div class="envelope" onclick="openEnv(0)">🌧️ Open when sad</div>
  <div class="envelope" onclick="openEnv(1)">😔 Open when stressed</div>
  <div class="envelope" onclick="openEnv(2)">🌙 Open when you miss me</div>
  <div class="envelope" onclick="openEnv(3)">💖 Open when you need love</div>
  <div class="envelope" onclick="openEnv(4)">🫂 Open when alone</div>
  <div class="envelope" onclick="openEnv(5)">💪 Open when weak</div>
  <div class="envelope" onclick="openEnv(6)">🌈 Open when overwhelmed</div>
  <div class="envelope" onclick="openEnv(7)">🌸 Open when you need peace</div>

  <div id="envBox" class="card" style="display:none;"></div>

  <button onclick="back()">⬅ Back</button>
</div>

<script>

/* START */
function start(){
  document.querySelector("button").style.display="none";
  menu.style.display="block";
  confetti();
  balloons();
}

/* NAV */
function show(id){
  menu.style.display="none";
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function back(){
  menu.style.display="block";
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
}

/* LETTER */
function openLetter(){
  let content=document.getElementById("letterContent");
  let typed=document.getElementById("typedLetter");

  content.style.display="block";

  let text = `Dear Nas,

I’ve never written a formal letter to you before but I feel like as the time progresses, and we get older and more mature it can lead to this!

So I’d like to start off by saying 
Happy 35th birthday! 🎉💖

May the Dear Lord watch over you with grace🙏

I want to say how great of a person you are and how much you mean to me🫶🏼🫶🏼. At times I realize that you’re not just my aunt, you’re someone I can laugh with, talk to, and always count on🫂. I really appreciate everything you do for me, even the little things that might not seem like a big deal but mean so much💕. I want you to know that they don’t go unnoticed🥰.

You always bring such a good energy, and being around you even if it’s just over the phone makes things better👭. I’m really lucky to have you in my life, and I don’t say that enough💖.

I know growing up it wasn’t always “rainbows and glitters” 🤧 but it’s good to say things changed for the better💯. I’ll never forget the times we would get ourselves into trouble and be so scared to tell you 😂 but now you’re one of the first persons we run to when things get a bit crazy💕. You always try to ensure that everyone is okay but I want you to remember that it’s your first time living too🫂🫂. I want you to know that you have a whole team behind you💆‍♀️. I know you have Halle and Oj but I’ll never stop being one of your loudest cheerleaders💝🫶🏼. I hope we’re aunty and niece in every universe❤️. Everyone deserves a good aunt but just not mine😂. I’ll love you always aunty Nas💕

Since it’s May: May your basket never run empty🙏, May God be with you every step of the way🙏, May your heart be filled with love and peace🙏 and May happiness find you always🙏.

I hope this year brings you happiness, success, peace, and everything you deserve 🫶🏼🫶🏼🫶🏼 (which is a lot 💕).

Thank you for being you, and for always being there for me🫂🫂🫂.

I love you so much❤️

Yours truly💋,
Devona Burrell`;

  typed.innerHTML="";
  let i=0;
  function type(){
    if(i<text.length){
      typed.innerHTML += text[i]==="\n"?"<br>":text[i];
      i++;
      setTimeout(type,12);
    }
  }
  type();
}

const reasons = [
"You always check on me",
"You make conversations feel easy and comfortable every time we talk",
"You make me feel safe",
"You always listen to me",
"You support me in your own way",
"You care about everyone around you",
"You have a good heart",
"You’re strong even when things are hard",
"You make me laugh when I don’t feel like smiling",
"You can turn a bad day into a better one",
"You always try your best for your family",
"You don’t give up easily",
"You’re protective in a loving way",
"You’re real and honest",
"You don’t pretend to be someone else",
"You always show up for people",
"You’ve been through a lot but still stand strong",
"You make family feel like family",
"You’re fun to be around",
"You have your own little sayings or jokes 😂",
"You can be strict but it comes from love",
"You always want the best for me",
"You care even when I don’t say anything",
"You have a big heart for people",
"You make holidays and birthdays feel special",
"You are someone I can trust",
"You always try to fix things",
"You give comfort without even trying",
"You are more important to me than I say",
"You are appreciated more than you know",
"You’re my safe space",
"You make life better just by being in it",
"You’re my aunt but also like a friend",
"I’m proud to have you in my life",
"I love you for being you 💖"
];

function showReasons(){
  let box = document.getElementById("reasonBox");
  box.innerHTML = "";

  let i = 0;

  function next(){
    if(i >= reasons.length) return;

    let div = document.createElement("div");
    div.innerText = reasons[i];
    div.style.background = "white";
    div.style.margin = "10px auto";
    div.style.padding = "12px";
    div.style.borderRadius = "10px";
    div.style.maxWidth = "500px";

    box.appendChild(div);

    i++;
    setTimeout(next, 120);
  }

  next();
}
/* ENVELOPES */
const env = [
"🌧️ Open when you feel sad\nI know things don’t always feel okay, but I need you to remember you’re never alone. I love you so much and I’m always here for you, no matter what.\n\n🙏 “The Lord is close to the brokenhearted.” – Psalm 34:18",

"😔 Open when you feel stressed\nBreathe. Slow down. You don’t have to fix everything at once. I need you to take care of yourself too, okay?\n\n🙏 “Cast all your anxiety on Him because He cares for you.” – 1 Peter 5:7",

"🌙 Open when you miss me\nEven if we’re not together, just know I’m always thinking about you. You’re always in my heart.\n\n🙏 “I thank my God every time I remember you.” – Philippians 1:3",

"💖 Open when you need love\nYou are so loved—not just by me, but by God and so many people around you. Don’t ever doubt that.\n\n🙏 “Love never fails.” – 1 Corinthians 13:8",

"🫂 Open when you feel alone\nEven when it feels like no one is there, I promise you are never alone.\n\n🙏 “Never will I leave you; never will I forsake you.” – Hebrews 13:5",

"💪 Open when you feel weak\nEven in your weakest moments, you are still strong. Don’t underestimate yourself.\n\n🙏 “My grace is sufficient for you, for my power is made perfect in weakness.” – 2 Corinthians 12:9",

"🌈 Open when you feel overwhelmed\nOne thing at a time. Don’t let everything weigh on you at once. You’ve got this.\n\n🙏 “Be still, and know that I am God.” – Psalm 46:10",

"🌸 Open when you need peace\nI pray you feel calm again. You deserve peace in your heart and mind.\n\n🙏 “Peace I leave with you; my peace I give you.” – John 14:27"
];
function openEnv(i){
  let box=document.getElementById("envBox");
  box.style.display="block";
  box.innerHTML="<p>"+env[i]+"</p>";
}

/* CONFETTI */
function confetti(){
  for(let i=0;i<50;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["red","blue","yellow","pink","purple"][Math.floor(Math.random()*5)];
    c.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

/* BALLOONS */
function balloons(){
  for(let i=0;i<10;i++){
    let b=document.createElement("div");
    b.className="balloon";
    b.innerHTML="🎈";
    b.style.left=Math.random()*100+"vw";
    b.style.animationDuration=(Math.random()*3+4)+"s";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),7000);
  }
}

</script>

</body>
</html>
